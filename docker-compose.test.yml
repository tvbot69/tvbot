services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: tvbot
      POSTGRES_PASSWORD: tvbot
      POSTGRES_DB: tvbot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvbot -d tvbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgtest-data:/var/lib/postgresql/data

volumes:
  pgtest-data:
