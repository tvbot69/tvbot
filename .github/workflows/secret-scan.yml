# TruffleHog over Gitleaks: keyless, no paid plan, no token to commit.
# Scans push/PR diff via git history; --only-verified keeps noise low, --fail fails red.
# Action pinned by SHA, no version input: action default tracks a published image; a wrong manual pin breaks the pull.

name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Never let two runs of the same ref compete; cancel the older one.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: trufflehog (verified secrets only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan diff for verified secrets
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          extra_args: --only-verified
