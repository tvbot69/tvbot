# Continuous integration gate.
#
# Build first, then tests, then lint. `npm test` does NOT typecheck, so a bad
# constructor arity passes the suite and breaks the build - which is exactly how
# that reaches production while every test is green.
#
# No secrets, deliberately. Nothing here touches Discord, Last.fm, Spotify or a
# Lavalink node: the build is tsc and the suite mocks the network. The suite used
# to require a real DISCORD_TOKEN because prismaClient validated the environment
# at import time, so a fresh clone could not run `npm test` at all;
# `src/tests/setupEnv.ts` now supplies shape-valid fakes, so neither CI nor a new
# contributor needs credentials. The dummy values below are obviously fake for
# exactly that reason - they only satisfy prisma generate and the env validator.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never let two runs of the same ref compete; cancel the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (tsc typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc is the real gate. Kept separate from the test job so a type error
      # is reported as a type error, not as 900 test failures.
      #
      # DATABASE_URL is genuinely needed here: `prisma generate` reads the
      # datasource from the schema and refuses to run without it. It is never
      # connected to - no test or build step opens a socket.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  test:
    name: tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Coverage ratchet
        # Runs the suite again with --coverage, which is a real cost, so it is
        # a separate step rather than replacing `npm test`: a plain test failure
        # is reported in seconds, and only a green run pays for the coverage pass.
        #
        # Fails if coverage drops below the thresholds in vitest.config.ts. Those
        # are set with `all: true`, so a file gaining or losing tests cannot move
        # the number by changing which files are counted.
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Blocking. The error count was driven to zero before this flag was
      # removed, and it must stay that way: 730 warnings remain (mostly
      # no-explicit-any at the moonlink boundary) but warnings do not fail a
      # build, so this job is now a real gate rather than a report.
      #
      # If this starts failing, do NOT add --quiet, --fix or a blanket disable
      # to make it green. Fix the code, or add a narrowly scoped inline
      # justification.
      - name: Lint
        run: npm run lint

  render:
    name: render tests (needs Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # A chart generator that silently renders a blank image is a real
      # user-facing bug, so these are worth running - but they need a browser, so
      # they are a separate job rather than something the unit suite depends on.
      # Excluding them from `npm test` is what keeps the unit suite runnable
      # with no Chromium installed at all.
      - name: Render tests
        run: npm run test:render
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci