# Continuous integration gate.
#
# Why this exists: `npm test` does NOT typecheck, and the local rule is
# `npm run build` THEN `npm test`. Without CI those two are gated on one
# person's machine remembering to run them. A green suite plus a red build is
# exactly how a bad constructor arity reaches production while every test
# passes, so the build is the gate that matters most and it runs first.
#
# Secrets are deliberately absent. Nothing here touches a real Discord token,
# a real database or a real Lavalink node: the build is tsc, and the suite
# mocks the network. Dummy values below only satisfy prisma generate and the
# env validator, which is why they are obviously fake.

name: CI

# No secrets anywhere, and deliberately so. Nothing in this pipeline contacts
# Discord, Last.fm, Spotify or a Lavalink node: the build is tsc, the tests mock
# the network, and the only socket that is never opened is the one DATABASE_URL
# points at.
#
# The suite used to need a real DISCORD_TOKEN because `prismaClient` reaches
# `assertValidEnvironment()` through `configData`'s lazy getter at import time,
# and validation happened against the developer's local `.env`. That meant a
# fresh clone could not run `npm test` at all. `src/tests/setupEnv.ts` now
# supplies shape-valid fake fallbacks, so CI needs no credentials and neither
# does a new contributor.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never let two runs of the same ref compete; cancel the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (tsc typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc is the real gate. Kept separate from the test job so a type error
      # is reported as a type error, not as 900 test failures.
      #
      # DATABASE_URL is genuinely needed here: `prisma generate` reads the
      # datasource from the schema and refuses to run without it. It is never
      # connected to - no test or build step opens a socket.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  test:
    name: tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Blocking. The error count was driven to zero before this flag was
      # removed, and it must stay that way: 730 warnings remain (mostly
      # no-explicit-any at the moonlink boundary) but warnings do not fail a
      # build, so this job is now a real gate rather than a report.
      #
      # If this starts failing, do NOT add --quiet, --fix or a blanket disable
      # to make it green. Fix the code, or add a narrowly scoped inline
      # justification.
      - name: Lint
        run: npm run lint
