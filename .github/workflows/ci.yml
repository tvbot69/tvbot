# Continuous integration gate.
#
# Build first, then tests, then lint. `npm test` does NOT typecheck, so a bad
# constructor arity passes the suite and breaks the build - which is exactly how
# that reaches production while every test is green.
#
# No secrets, deliberately. Nothing here touches Discord, Last.fm, Spotify or a
# Lavalink node: the build is tsc and the suite mocks the network. The suite used
# to require a real DISCORD_TOKEN because prismaClient validated the environment
# at import time, so a fresh clone could not run `npm test` at all;
# `src/tests/setupEnv.ts` now supplies shape-valid fakes, so neither CI nor a new
# contributor needs credentials. The dummy values below are obviously fake for
# exactly that reason - they only satisfy prisma generate and the env validator.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never let two runs of the same ref compete; cancel the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (tsc typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # tsc is the real gate. Kept separate from the test job so a type error
      # is reported as a type error, not as 900 test failures.
      #
      # DATABASE_URL is genuinely needed here: `prisma generate` reads the
      # datasource from the schema and refuses to run without it. It is never
      # connected to - no test or build step opens a socket.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  test:
    name: tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Coverage ratchet
        # Runs the suite again with --coverage, which is a real cost, so it is
        # a separate step rather than replacing `npm test`: a plain test failure
        # is reported in seconds, and only a green run pays for the coverage pass.
        #
        # Fails if coverage drops below the thresholds in vitest.config.ts. Those
        # are set with `all: true`, so a file gaining or losing tests cannot move
        # the number by changing which files are counted.
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Blocking. The error count was driven to zero before this flag was
      # removed, and it must stay that way: 56 warnings remain (mostly
      # no-console in logger/tests/scripts) but warnings do not fail a
      # build, so this job is now a real gate rather than a report.
      #
      # If this starts failing, do NOT add --quiet, --fix or a blanket disable
      # to make it green. Fix the code, or add a narrowly scoped inline
      # justification.
      - name: Lint
        run: npm run lint

      # check:log needs a live logfile, which CI does not have, so the monitor
      # itself is pinned here by its unit suite (already part of npm test).
      - name: Check log invariants
        run: npx vitest run src/__tests__/logInvariants.test.ts

  render:
    name: render tests (needs Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # A chart generator that silently renders a blank image is a real
      # user-facing bug, so these are worth running - but they need a browser, so
      # they are a separate job rather than something the unit suite depends on.
      # Excluding them from `npm test` is what keeps the unit suite runnable
      # with no Chromium installed at all.
      - name: Render tests
        run: npm run test:render
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  deps:
    name: import cycles (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails if the cycle count rises above the recorded budget. If this goes
      # red, break a cycle - do NOT raise MAX_CYCLES. The plan target is zero;
      # this keeps it from going backwards while that is worked through.
      - name: Check import cycles
        run: npm run deps:cycles
  debt:
    name: debt ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # One number per debt kind, each against a recorded budget that may only
      # go down. A new `: any` fails the build.
      - name: Check debt ratchet
        run: npm run debt
  guards:
    name: metrics and docs guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fail on metrics drift or oversize docs. Both scripts are check-only.
      - name: Check metrics and docs size
        run: npm run metrics:check && npm run docs:check
  migrations:
    name: migrations apply to a real postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    # This job exists because 20260928010000_user_plays_dedup_index failed on
    # production with SqlState 42P17, and because `npm start` is
    # `migrate deploy && node dist/bot/index.js`, P3009 took the ENTIRE bot down.
    # Nothing in CI was applying these migrations to a real database, so a
    # syntactically valid but unusable index reached production.
    #
    # A migration only counts as tested once a real Postgres has executed it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tvbot
          POSTGRES_PASSWORD: tvbot
          POSTGRES_DB: tvbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tvbot:tvbot@localhost:5432/tvbot?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate the client
        run: npx prisma generate --schema src/persistence/prisma/schema.prisma

      # The gate. Every migration in the repo, applied for real, in order.
      - name: Apply every migration
        run: npx prisma migrate deploy --schema src/persistence/prisma/schema.prisma

      - name: Database is at the expected version
        run: npx prisma migrate status --schema src/persistence/prisma/schema.prisma

      # The gate for the bug that started this: schema.prisma declared 20 columns
      # that NO migration in this history ever created, and nothing noticed. The
      # Prisma client is generated FROM the schema, so it emitted SQL for a column
      # the database had never had and the first real query died with P2022. It
      # was found only when the raw-SQL tests below first ran against a real
      # Postgres - i.e. it was found by luck.
      #
      # Nothing else in this workflow can catch it. `prisma generate` reads only
      # the schema, tsc reads only the schema, `npm test` mocks the database, and
      # `migrate deploy` validates each migration on its own terms without ever
      # asking whether the SUM of them is the schema.
      #
      # SHADOW_DATABASE_URL, not DATABASE_URL: `--from-migrations` replays the
      # migrations folder into a throwaway database and Prisma RESETS whatever
      # database it is given. Pointing it at `tvbot` would wipe the database the
      # remaining steps in this job read from. Hence the separate `tvbot_ci_shadow`.
      # The gate falls back to diffing DATABASE_URL directly when no shadow URL is
      # present, and to a database-free columns-and-indexes check when neither
      # exists - and it says loudly which of the three it ran.
      #
      # --selftest runs first and is blocking. The strict comparison below parses
      # `prisma migrate diff` output, and a parser that stops recognising a
      # statement shape reports "clean" forever - the exact failure this step
      # exists to prevent. Running only the gate would leave that parser
      # unverified by anything.
      - name: Create the shadow database
        run: PGPASSWORD=tvbot psql -h localhost -U tvbot -d tvbot -c "CREATE DATABASE tvbot_ci_shadow"

      - name: Schema matches the migrations
        run: npm run db:verify-schema-drift -- --selftest && npm run db:verify-schema-drift
        env:
          SHADOW_DATABASE_URL: postgresql://tvbot:tvbot@localhost:5432/tvbot_ci_shadow?schema=public

      # A functional index can only be judged by being built, so verify the
      # expression and the constraint against the real column types here rather
      # than in production. Runs against a throwaway TEMP table.
      - name: Verify the dedup index expression builds
        run: npm run db:verify-index-expr

      - name: Verify the dedup constraint holds
        run: npm run db:verify-constraint

      - name: Verify the index exists and the data is clean
        run: npm run db:check-index

      # The raw queries. 28 `$queryRawUnsafe` calls were unexecuted until now:
      # a renamed column or a GROUP BY Postgres rejects is a RUNTIME failure
      # with a green build and a green unit suite, because the unit tests mock
      # the database. This job already has a real Postgres with every migration
      # applied, so it is the only place these can be proven.
      #
      # TEST_DATABASE_URL, not DATABASE_URL: dbHarness REFUSES any database
      # whose name does not look like a scratch database, because the tests
      # TRUNCATE every table. Setting it to a real one must not be possible by
      # accident.
      # The postgres service only creates POSTGRES_DB, so the scratch database
      # the tests point at has to be created explicitly. dbHarness deliberately
      # refuses a name that does not look like scratch, which is why this cannot
      # just reuse the `tvbot` database.
      - name: Create the scratch database
        run: PGPASSWORD=tvbot psql -h localhost -U tvbot -d tvbot -c "CREATE DATABASE tvbot_ci_test"

      # The scratch database is created EMPTY, and the migrations above were applied
      # to the `tvbot` database, not this one. Without migrating it the tests run
      # against a database with no tables and fail on the first query - which is
      # exactly what happened for three CI runs.
      - name: Apply the migrations to the scratch database
        run: npx prisma migrate deploy --schema src/persistence/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://tvbot:tvbot@localhost:5432/tvbot_ci_test?schema=public

      - name: Raw SQL against a real database
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://tvbot:tvbot@localhost:5432/tvbot_ci_test?schema=public

  # Independent and fast by design: no `needs: build`, no DATABASE_URL, no
  # secrets. Fails on high-or-worse advisories only.
  audit:
    name: audit (npm audit high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit
        run: npm audit --audit-level=high