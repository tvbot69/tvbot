[phases.setup]
nixPkgs = ['nodejs_22', 'openssl', 'ffmpeg', 'chromium']

[phases.install]
cmds = ['PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm ci']

[phases.build]
cmds = ['npm run build']

[start]
cmd = 'npx prisma migrate deploy --schema src/persistence/prisma/schema.prisma && node --max-old-space-size=384 dist/bot/index.js'

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = 'true'
PUPPETEER_EXECUTABLE_PATH = '/usr/bin/chromium'
FFMPEG_PATH = '/usr/bin/ffmpeg'
FFPROBE_PATH = '/usr/bin/ffprobe'
NODE_ENV = 'production'
ENVIRONMENT = 'production'
