<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 1200px;
      height: 100%;
      background-color: #0b0d13;
    }

    body {
      width: 1200px;
      height: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", sans-serif;
      color: #f0f6fc;
      background-color: #0b0d13;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 40px;
    }

    /* Dynamic Album Covers Mosaic Wallpaper */
    .mosaic-wallpaper {
      position: absolute;
      inset: -40px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 14px;
      transform: rotate(-1.5deg) scale(1.05);
      opacity: 0.92;
      z-index: 0;
      filter: saturate(1.2) contrast(1.08);
    }

    .mosaic-tile {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #131722;
    }

    .mosaic-tile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Ambient Dark Vignette & Mesh Overlay */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(11, 13, 19, 0.20) 0%, rgba(11, 13, 19, 0.62) 100%),
                  linear-gradient(180deg, rgba(11, 13, 19, 0.18) 0%, rgba(11, 13, 19, 0.62) 100%);
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 24px;
    }

    /* Header Section */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #cbd5e1;
      width: fit-content;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6366f1;
      box-shadow: 0 0 8px #6366f1;
    }

    .media-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 800px;
    }

    .server-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      max-width: 320px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Grid Layout */
    .content-grid {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 28px;
      flex: 1;
      align-items: stretch;
    }

    /* Left Card: Artwork showcase */
    .artwork-card {
      background: rgba(14, 18, 28, 0.42);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .artwork-img-wrapper {
      width: 400px;
      height: 400px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #131722;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .artwork-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .artwork-placeholder {
      font-size: 72px;
      color: #475569;
    }

    .brand-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .brand-dot {
      color: #6366f1;
    }

    /* Right Card: Leaderboard */
    .leaderboard-card {
      background: rgba(14, 18, 28, 0.42);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .user-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .user-row {
      display: flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 10px;
      background: rgba(11, 13, 19, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: none;
      height: 42px;
    }

    .user-row.caller-highlight {
      background: rgba(99, 102, 241, 0.16);
      border: 1px solid rgba(99, 102, 241, 0.4);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.2);
    }

    .rank-col {
      width: 38px;
      font-weight: 800;
      font-size: 16px;
      color: #94a3b8;
      display: flex;
      align-items: center;
    }

    .rank-crown {
      font-size: 18px;
      color: #ffd700;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.6));
    }

    .rank-gold {
      color: #facc15;
    }

    .rank-silver {
      color: #cbd5e1;
    }

    .rank-bronze {
      color: #fb923c;
    }

    .name-col {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 12px;
    }

    .caller-highlight .name-col {
      color: #ffffff;
      font-weight: 700;
    }

    .plays-col {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #94a3b8;
      text-align: right;
    }

    .caller-highlight .plays-col {
      color: #c7d2fe;
    }

    .plays-unit {
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      margin-left: 4px;
    }

    /* Caller Outside Top 10 Divider Row */
    .caller-outside-container {
      margin-top: 6px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      padding-top: 8px;
    }

    /* Stats Summary Pill Bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px 20px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
      margin-top: 14px;
    }

    .stat-sep {
      color: #475569;
    }

    .stat-highlight {
      color: #ffffff;
      font-weight: 700;
    }

    /* Crown Notification Ribbon */
    .crown-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(234, 179, 8, 0.12), rgba(234, 179, 8, 0.2), rgba(234, 179, 8, 0.12));
      border: 1px solid rgba(234, 179, 8, 0.35);
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.12);
      font-size: 15px;
      font-weight: 700;
      color: #fef08a;
      text-align: center;
    }

    .crown-banner-icon {
      font-size: 20px;
      filter: drop-shadow(0 0 8px rgba(253, 224, 71, 0.6));
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Dynamic Album Covers Mosaic Wallpaper -->
  <div class="mosaic-wallpaper">
    {{mosaic-tiles}}
  </div>
  <div class="bg-overlay"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="badge-pill">
          <span class="badge-dot"></span>
          <span>{{type}}</span>
        </div>
        <h1 class="media-title">{{title}}</h1>
      </div>
      <div class="server-pill">
        <span>{{location}}</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content-grid">
      <!-- Left: Artwork Showcase -->
      <div class="artwork-card {{hide-img}}">
        <div class="artwork-img-wrapper">
          <img class="artwork-img" src="{{image-url}}" alt="Cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <div class="artwork-placeholder" style="display: none;">🎵</div>
        </div>
        <div class="brand-footer">
          <span>Powered by</span>
          <span class="brand-dot">✦</span>
          <span>tvbot</span>
        </div>
      </div>

      <!-- Right: Leaderboard -->
      <div class="leaderboard-card">
        <ul class="user-list">
          {{users}}
        </ul>

        {{caller-html}}

        <div class="stats-bar">
          <span><strong class="stat-highlight">{{listeners}}</strong> listeners</span>
          <span class="stat-sep">·</span>
          <span><strong class="stat-highlight">{{plays}}</strong> total plays</span>
          <span class="stat-sep">·</span>
          <span><strong class="stat-highlight">{{average}}</strong> avg</span>
        </div>
      </div>
    </div>

    <!-- Crown Status Banner (if active) -->
    {{crown-html}}
  </div>
</body>
</html>
